[package]
name = "riperf"
version = "0.1.0"
edition = "2021"
authors = ["riperf contributors"]
description = "A network performance measurement tool (iperf3-compatible)"
license = "MIT"
repository = "https://github.com/example/riperf"
keywords = ["network", "performance", "bandwidth", "iperf"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "riperf"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = 'abort'

[profile.dev]
opt-level = 0
debug = true